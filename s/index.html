<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://civilinitiatives.org/site.js?b=20261112d"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared file - Launchpad</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#4f46e5">
<script>
try{ var m = document.cookie.match(/(?:^|; )hl_theme=(dark|light|system)/), t = m ? m[1] : JSON.parse(localStorage.getItem("hl.theme"));
     if(t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<link rel="stylesheet" href="https://suite.civilinitiatives.org/office/office.css?b=20261109c">
<style>
:root{--a1:#4f46e5}
body{overflow:auto;display:block}
.top{position:sticky;top:0}
.top .brand.lp img{width:30px;height:30px;border-radius:9px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.top .brand.lp:hover span{text-decoration:underline}
.top .tbtn.mine{background:rgba(255,255,255,.24)}
@media (max-width:640px){ .top a.tbtn.mine{display:inline-flex} .top .tbtn.mine .lbl{display:inline} }
main{max-width:860px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:1.4rem;margin:4px 0 2px;overflow-wrap:anywhere}
.meta{color:var(--soft);margin:0 0 16px;font-size:.92rem}
.view{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:14px;margin-bottom:14px;display:grid;place-items:center;min-height:120px}
.view img{max-width:100%;max-height:70vh;border-radius:12px;display:block}
.view audio{width:100%}
.view pre{width:100%;max-height:60vh;overflow:auto;margin:0;font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
.view .big{font-size:3.5rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts a{text-decoration:none}
.note{color:var(--soft);font-size:.84rem;margin-top:14px}
.empty{color:var(--soft);text-align:center;padding:40px 10px}
</style>
<link rel="stylesheet" href="https://civilinitiatives.org/glass.css?b=20261102a">
</head>
<body>
<header class="top">
  <a class="brand lp" href="https://civilinitiatives.org/" title="Back to the Launchpad"><img src="https://civilinitiatives.org/icons/icon-192.png" alt="" width="30" height="30"><span>Launchpad</span></a>
  <span class="status" id="status" aria-live="polite"></span>
  <span class="sp"></span>
  <button class="tbtn" id="themeBtn" type="button"></button>
  <a class="tbtn mine" href="/">🗂<span class="lbl"> My Files</span></a>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="/auth-store.js?b=20261026a"></script>
<script src="https://suite.civilinitiatives.org/office/office.js?b=20261111e"></script>
<script src="/share.js?b=20261113a"></script>
</body>
</html>
